[supervisord]
nodaemon=true

[program:websocket]
command=php /var/www/publisher/bin/console gos:websocket:server --host=0.0.0.0 --port=8082 --env=prod
directory=/var/www/publisher
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/websocket-stdout.log
stderr_logfile=/var/log/supervisor/websocket-stderr.log
startretries=3
startsecs=5
priority=100
