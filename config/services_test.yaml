services:
  _defaults:
    public: true
    autowire: true
    autoconfigure: true

    # If you need to access services in a test, create an alias
    # and then fetch that alias from the container. As a convention,
    # aliases are prefixed with test. For example:
    #
    # test.App\Service\MyService: '@App\Service\MyService'
  behatch.http_call.request:
    class: Behatch\HttpCall\Request
    arguments:
      - '@behat.mink'
    public: false

  GeoLocationContext:
    class: 'GeoLocationContext'
    public: true
    arguments:
      - '@behatch.http_call.request'
      - '@SWP\Component\GeoIP\Reader\ReaderInterface'

  AuthTokenContext:
    class: "AuthTokenContext"
    public: true
    arguments:
      - '@behatch.http_call.request'
      - '@swp.security.user_provider'
      - '@swp.repository.api_key'
      - '@swp.factory.api_key'

  SWP\Bundle\CoreBundle\Controller\DefaultController:
    arguments:
      $tenantContext: '@swp_multi_tenancy.tenant_context'
      $metaFactory: '@swp_template_engine_context.factory.meta_factory'
      $templateEngineContext: '@swp_template_engine_context'
      $routeFactory: '@swp.factory.route'
      $connection: '@doctrine.dbal.default_connection'
      $elasticaClient: '@fos_elastica.client.default'
      $cachePool: '@session.memcached'
      $amqpConnection: '@?app.amqp_connection'


